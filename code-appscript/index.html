    .trend-down { background: rgba(192,57,43,.12); color: #c0392b; }
    .trend-flat { background: rgba(120,137,153,.15); color: #78899a; }
    .info-box-sub { font-size: 11.5px; color: #8b9aa8; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info-box.clickable { cursor: pointer; transition: transform .2s, box-shadow .2s; }
    .info-box.clickable:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.13); }

    /* donut + share legend */
    .donut-box { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .donut-hold { position: relative; width: 186px; height: 186px; flex-shrink: 0; margin: 0 auto; }
    .donut-mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
    .donut-mid b { font-size: 26px; font-weight: 700; color: var(--navy-primary); line-height: 1; }
    .donut-mid span { font-size: 11px; color: #8b9aa8; margin-top: 3px; text-transform: uppercase; letter-spacing: .5px; }
    .donut-legend { flex: 1; min-width: 150px; }
    .dl-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; }

    /* thumbnail list rows — properties / viewings */

    .dlist-thumb { width: 56px; height: 44px; border-radius: var(--r-sm); object-fit: cover; flex-shrink: 0; background: #e8eef5; }

    .dlist-main { flex: 1; min-width: 0; }
    .dlist-t { font-weight: 600; font-size: 13.5px; color: #223; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dlist-s { font-size: 12px; color: #8b9aa8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dlist-r { text-align: right; flex-shrink: 0; }
    .dlist-p { font-weight: 700; font-size: 13px; color: var(--navy-accent); white-space: nowrap; }
    .dlist-d { font-size: 11px; color: #9aa8b5; margin-top: 3px; white-space: nowrap; }
    .dlist-chev { color: #c3d0dc; font-size: 12px; flex-shrink: 0; }
    .card-link { background: none; border: none; color: var(--navy-accent); font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 2px 6px; }

    .dash-empty { text-align: center; color: #8b9aa8; padding: 26px 0; font-size: 13px; }
    .dash-empty i { display: block; font-size: 26px; color: #c8d4e0; margin-bottom: 8px; }

    /* conversion funnel */
    .fn-row { display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; gap: 8px; margin-bottom: 6px; }
    .fn-label { font-size: 12px; color: #667; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fn-bar { height: 38px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 14px; margin: 0 auto; min-width: 56px; cursor: pointer;
      clip-path: polygon(0 0, 100% 0, 91% 100%, 9% 100%); transition: filter .2s; }
    .fn-bar:hover { filter: brightness(1.12); }
    .fn-pct { font-size: 11.5px; color: #8b9aa8; font-weight: 600; }
    .fn-foot { text-align: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid #eef2f7; font-size: 13px; font-weight: 700; color: var(--navy-accent); }

    /* top agents */
    .ag-row { display: flex; align-items: center; gap: 11px; padding: 9px 2px; border-bottom: 1px solid #eef2f7; }
    .ag-row:last-child { border-bottom: none; }
    .ag-av { width: 36px; height: 36px; border-radius: 50%; background: var(--navy-accent); color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12.5px; flex-shrink: 0; text-transform: uppercase; }
    .ag-main { flex: 1; min-width: 0; }
    .ag-n { font-weight: 600; font-size: 13.5px; color: #223; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ag-s { font-size: 11.5px; color: #8b9aa8; }
    .ag-v { font-weight: 700; font-size: 13px; color: #2e7d32; white-space: nowrap; text-align: right; }
    .ag-bar { height: 4px; border-radius: 3px; background: #e8eef5; margin-top: 5px; overflow: hidden; }
    .ag-bar span { display: block; height: 100%; background: var(--navy-accent); transition: width .5s ease; }

    /* my-month card (own scope) */
    .mm-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 2px; border-bottom: 1px solid #eef2f7; font-size: 13.5px; }
    .mm-row:last-child { border-bottom: none; }
    .mm-row span { color: #667; }
    .mm-row b { color: var(--navy-primary); }

    /* range chips on the leads trend card */
    .rng-chip { border: 1px solid #dbe4ee; background: #fff; color: #667; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: var(--r-pill); cursor: pointer; }
    .rng-chip.on { background: var(--navy-accent); border-color: var(--navy-accent); color: #fff; }

    body.dark-mode .dlist-row, body.dark-mode .ag-row, body.dark-mode .mm-row { border-bottom-color: rgba(255,255,255,.07); }
    body.dark-mode .fn-foot { border-top-color: rgba(255,255,255,.07); }

    body.dark-mode .dlist-t, body.dark-mode .ag-n, body.dark-mode .mm-row b, body.dark-mode .dl-num, body.dark-mode .donut-mid b { color: #dbe6f2; }

    body.dark-mode .dlist-thumb { background: #2a2a2a; }
    body.dark-mode .rng-chip { background: #262626; border-color: #3a3a3a; color: #b6c3d1; }
    body.dark-mode .rng-chip.on { background: var(--navy-accent); border-color: var(--navy-accent); color: #fff; }
    body.dark-mode .ag-bar { background: rgba(255,255,255,.1); }
    @media (max-width: 560px) { .fn-row { grid-template-columns: 74px 1fr 40px; } .fn-label { font-size: 11px; } .donut-hold { width: 160px; height: 160px; } }

    /* ===== Leads kanban board — drag between stages, one column per lead status ===== */
    .kb-wrap { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 12px; align-items: flex-start; }
    .kb-col { flex: 0 0 286px; max-width: 286px; background: #f2f6fa; border-radius: var(--r-md); display: flex; flex-direction: column; max-height: 72vh; transition: background .18s; }
    .kb-col.over { outline: 2px dashed var(--navy-accent); outline-offset: -2px; background: #e6f1fd; }
    .kb-head { display: flex; align-items: center; gap: 8px; padding: 11px 12px; border-bottom: 1px solid #e3ebf3; position: sticky; top: 0; background: inherit; border-radius: var(--r-md) var(--r-md) 0 0; z-index: 2; }
    .kb-bar { width: 4px; height: 18px; border-radius: 3px; flex-shrink: 0; }
    .kb-name { flex: 1; font-size: 13px; font-weight: 700; color: var(--navy-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kb-count { background: #fff; color: #667; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: var(--r-pill); border: 1px solid #e3ebf3; }
    .kb-body { padding: 10px; display: flex; flex-direction: column; gap: 9px; overflow-y: auto; flex: 1; min-height: 74px; }
    .kb-card { background: #fff; border-radius: var(--r-sm); padding: 10px 11px; box-shadow: 0 1px 3px rgba(0,0,0,.09); border-left: 3px solid transparent;
      transition: box-shadow .18s, transform .18s; position: relative; }
    .kb-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.13); transform: translateY(-1px); }
    .kb-card.dragging { opacity: .45; }
    .kb-t { font-weight: 700; font-size: 13.5px; color: #223; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 24px; }
    .kb-s { font-size: 11.5px; color: #8b9aa8; margin-top: 2px; }
    .kb-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .kb-tag { font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: var(--r-pill); background: #eef3f9; color: #55697c; }
    .kb-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 8px; padding-top: 7px; border-top: 1px solid #f0f4f8; }
    .kb-agent { font-size: 10.5px; color: #8b9aa8; display: flex; align-items: center; gap: 5px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kb-agent i { color: var(--navy-accent); }
    .kb-acts { display: flex; gap: 2px; flex-shrink: 0; }
    .kb-acts button { border: none; background: none; color: #9aa8b5; cursor: pointer; padding: 3px 5px; font-size: 12px; border-radius: var(--r-sm); }
    .kb-acts button:hover { background: #eef3f9; color: var(--navy-accent); }
    .kb-move { position: absolute; top: 7px; right: 7px; }
    .kb-move-btn { border: none; background: none; color: #b8c6d4; cursor: pointer; font-size: 13px; padding: 2px 5px; }
    .kb-move-btn:hover { color: var(--navy-accent); }
    .kb-move-menu { position: absolute; right: 0; top: 24px; background: #fff; border: 1px solid #e3ebf3; border-radius: var(--r-sm); box-shadow: 0 8px 22px rgba(0,0,0,.16); z-index: 30; min-width: 178px; padding: 5px; }
    .kb-move-menu button { display: flex; align-items: center; gap: 8px; width: 100%; border: none; background: none; padding: 7px 9px; font-size: 12.5px; color: #445; cursor: pointer; border-radius: var(--r-sm); text-align: left; }
    .kb-move-menu button:hover { background: #eef3f9; }
    .kb-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .kb-empty { text-align: center; color: #a9bccf; font-size: 12px; padding: 18px 0; }
    .kb-more { text-align: center; font-size: 11.5px; color: #8b9aa8; padding: 6px 0 2px; }

    body.dark-mode .kb-col { background: #1a1a1a; }
    body.dark-mode .kb-col.over { background: #16283a; }
    body.dark-mode .kb-head { border-bottom-color: rgba(255,255,255,.07); }
    body.dark-mode .kb-name, body.dark-mode .kb-t { color: #dbe6f2; }
    body.dark-mode .kb-count { background: #262626; border-color: #3a3a3a; color: #b6c3d1; }
    body.dark-mode .kb-card, body.dark-mode .kb-move-menu { background: #242424; }
    body.dark-mode .kb-move-menu { border-color: #3a3a3a; }
    body.dark-mode .kb-move-menu button { color: #cfd9e4; }
    body.dark-mode .kb-move-menu button:hover, body.dark-mode .kb-acts button:hover { background: rgba(255,255,255,.07); }
    body.dark-mode .kb-tag { background: rgba(255,255,255,.07); color: #b6c3d1; }
    body.dark-mode .kb-foot { border-top-color: rgba(255,255,255,.07); }
    @media (max-width: 560px) { .kb-col { flex: 0 0 82vw; max-width: 82vw; } }

    /* ===== filter-grid alignment =====
       SearchableDropdown renders a .form-group, and .form-group carries an 18px form margin. Inside a filters
       grid that margin makes the row taller than the visible input, so any bottom-aligned action button sat
       ~18px low. Kill the margin here and give the action cell a spacer label so every cell shares one baseline. */
    .filters-grid > .form-group { margin-bottom: 0; }
    .filters-grid {
      align-items: stretch;
      grid-auto-rows: 70px;
    }
    .filters-grid > .filter-group,
    .filters-grid > .form-group {
      display: grid;
      grid-template-rows: 20px 44px;
      align-content: start;
      gap: 6px;
      width: 100%;
      min-width: 0;
      margin: 0;
    }
    .filters-grid > .filter-group > label,
    .filters-grid > .form-group > label {
      height: 20px;
      min-height: 20px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      overflow: hidden;
      color: var(--navy-primary);
      font-size: 12px;
      font-weight: 600;
      line-height: 20px;
      letter-spacing: .5px;
      text-transform: uppercase;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .filters-grid .filter-input,
    .filters-grid .searchable-dropdown,
    .filters-grid .searchable-dropdown-input,
    .filters-grid .filter-toggle {
      width: 100%;
      height: 44px !important;
      min-height: 44px;
      box-sizing: border-box;
    }
    .filters-grid .filter-input,
    .filters-grid .searchable-dropdown-input {
      padding-top: 8px;
      padding-bottom: 8px;
      font-size: 14px;
      line-height: 20px;
    }
    .filter-action > label { visibility: hidden; }
    .filter-action .btn { width: 100%; }
    @media (max-width: 768px) { .filter-action > label { display: none; } }

    /* ===== control normalisation (app-wide) =====
       `.form-group input` (0,0,1,1) outranks `.toggle` (0,0,1,0), so every toggle sitting inside a form group was
       being stretched to 100% width with form padding/border — the full-width grey bar. Pin it back, everywhere. */
    input.toggle, .form-group input.toggle, .filter-group input.toggle, .filter-toggle input.toggle {
      width: 44px; min-width: 44px; max-width: 44px; height: 24px; flex: 0 0 44px;
      padding: 0; border: none; border-radius: 24px; margin: 0;
    }
    /* toggle + its caption on one line, never a stacked block */
    .toggle-row { display: flex; align-items: center; gap: 10px; }
    .toggle-row label { margin: 0; }

    /* buttons read the same in every section: one height, one icon rhythm, one disabled state */
    .btn { line-height: 1.2; white-space: nowrap; transition: filter .18s, box-shadow .18s, transform .18s; }
    .btn i { font-size: .95em; }
    .btn:not(:disabled):hover { filter: brightness(1.08); box-shadow: 0 3px 10px rgba(0,0,0,.16); }
    .btn:not(:disabled):active { transform: translateY(1px); box-shadow: none; }
    .btn:disabled { background: #c8ced6; color: #f2f4f7; box-shadow: none; filter: none; opacity: 1; }
    .btn-sm i { font-size: .92em; }
    /* button groups keep an even rhythm instead of each caller inventing its own gap */
    .btn-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .filters-header .btn-row { margin-left: auto; }

    /* toggle cell — same box as the inputs beside it so the filter row reads as one control strip */
    .filter-toggle { display: flex; align-items: center; gap: 10px; min-height: 43px; padding: 0 14px; border: 2px solid #ced4da;
      border-radius: var(--r-md); background: #fff; transition: border-color .2s; }
    .filter-toggle:hover { border-color: var(--navy-accent); }
    .filter-toggle .ft-txt { font-size: 13px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #6b7a89;
      cursor: pointer; margin: 0; white-space: nowrap; user-select: none; }
    .filter-toggle .toggle:checked + .ft-txt { color: var(--navy-accent); }
    body.dark-mode .filter-toggle { background: #262626; border-color: #3a3a3a; }
    body.dark-mode .filter-toggle .ft-txt { color: #b6c3d1; }

    /* ===== field-level change history (Activity Logs "What Changed") ===== */
    .chg { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 3px 0; font-size: 12px; line-height: 1.5; }
    .chg + .chg { border-top: 1px dashed #eef2f7; }
    .chg b { color: var(--navy-primary); font-weight: 600; min-width: 92px; }
    .chg i { color: #b8c6d4; font-size: 9px; }
    .chg-a { background: #fdecea; color: #a03027; padding: 1px 7px; border-radius: var(--r-pill); text-decoration: line-through; }
    .chg-b { background: #e8f5ec; color: #1f6b34; padding: 1px 7px; border-radius: var(--r-pill); font-weight: 600; }
    body.dark-mode .chg b { color: #dbe6f2; }
    body.dark-mode .chg + .chg { border-top-color: rgba(255,255,255,.07); }
    body.dark-mode .chg-a { background: rgba(192,57,43,.18); color: #ff9b90; }
    body.dark-mode .chg-b { background: rgba(46,125,50,.18); color: #8ee0a4; }

    /* ===== report tabs — one DataTable per report ===== */
    .rep-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 10px;
      margin-bottom: 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 31, 63, 0.25) transparent;
      -webkit-overflow-scrolling: touch;
    }
    .rep-tabs::-webkit-scrollbar {
      height: 4px;
    }
    .rep-tabs::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.03);
      border-radius: 10px;
    }
    .rep-tabs::-webkit-scrollbar-thumb {
      background: linear-gradient(90deg, rgba(0, 31, 63, 0.3), rgba(0, 116, 217, 0.45));
      border-radius: 10px;
      transition: all 0.2s ease;
    }
    .rep-tabs::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(90deg, var(--navy-primary), var(--navy-accent));
    }
    body.dark-mode .rep-tabs::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    body.dark-mode .rep-tabs::-webkit-scrollbar-thumb {
      background: linear-gradient(90deg, rgba(0, 116, 217, 0.4), rgba(79, 195, 247, 0.6));
    }
    .rep-tab { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; border: 1px solid #dbe4ee; background: #fff;
      color: #55697c; font-size: 13px; font-weight: 600; padding: 9px 15px; border-radius: var(--r-pill); cursor: pointer; transition: all .18s; }
    .rep-tab i { color: var(--navy-accent); font-size: 12.5px; }
    .rep-tab:hover { border-color: var(--navy-accent); color: var(--navy-primary); }
    .rep-tab.on { background: var(--navy-primary); border-color: var(--navy-primary); color: #fff; box-shadow: 0 3px 10px rgba(0,31,63,.22); }
    .rep-tab.on i { color: #fff; }
    .rep-tab-n { background: rgba(0,0,0,.08); border-radius: var(--r-pill); padding: 1px 8px; font-size: 11px; }
    .rep-tab.on .rep-tab-n { background: rgba(255,255,255,.22); }
    .rep-hint { font-size: 12.5px; color: #8b9aa8; }
    .rep-hint i { color: var(--navy-accent); }
    .rep-bar { display: inline-block; width: 92px; height: 6px; border-radius: 4px; background: #e8eef5; overflow: hidden; vertical-align: middle; margin-right: 7px; }
    .rep-bar span { display: block; height: 100%; }
    body.dark-mode .rep-tab { background: #242424; border-color: #3a3a3a; color: #b6c3d1; }
    body.dark-mode .rep-tab.on { background: var(--navy-accent); border-color: var(--navy-accent); color: #fff; }

    /* ===== Curved design tokens — refine the blanket radius by element role (appended = wins) ===== */

    .btn, .dt-button, button.dt-button, .filter-input, .form-group input, .form-group select, .form-group textarea,
    .collapse-btn, .close-btn, .sidebar-close-btn, .action-icon, .sidebar-menu button, .sidebar-theme-toggle button,

    /* clip square-cornered children so the curve reads clean (NOT .modal — it hosts dropdown popovers) */

    .modal-header { border-radius: var(--r-md) var(--r-md) 0 0; }

    /* ---- branded processing overlay: writes only, above modals, not dismissible ---- */
    .proc-overlay { position: fixed; inset: 0; z-index: 3000; background: rgba(8,18,34,.58); backdrop-filter: blur(3px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    .proc-logo { width: 74px; height: 74px; border-radius: 50%; object-fit: cover; object-position: center; background: #fff; border: 2px solid rgba(255,255,255,.72); animation: procPulse 1.6s ease-in-out infinite; box-shadow: 0 0 0 6px rgba(255,255,255,.14); }
    .proc-bar { width: 190px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.25); overflow: hidden; }
    .proc-bar span { display: block; height: 100%; width: 40%; border-radius: 4px; background: var(--navy-accent); animation: procSlide 1.1s ease-in-out infinite; }

    /* ---- transaction split modal (money movers only — form left, live math right) ---- */
    .modal.modal-txn { width: 80%; max-width: 1400px; }

    /* ---- AI chat assistant ---- */

      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

      background: linear-gradient(135deg, #1b6ef3, #8b5cf6); color: #fff; font-size: 13px; }

        return fetch('/api/run/' + encodeURIComponent(fn), {

          const result = await response.json();
          if (!response.ok) throw new Error(result.message || 'Local data request failed');
          return result;
        }).finally(() => { if (verb) procEnd(); });

    // csv parse — RFC 4180 (quoted fields, escaped quotes, embedded newlines); shared by all list imports
    function parseCSV(text) {
      const rows = [];
      let row = [], field = '', inQ = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQ) {
          if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
          else if (c === '"') inQ = false;
          else field += c;
        } else {
          if (c === '"') inQ = true;
          else if (c === ',') { row.push(field); field = ''; }
          else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
          else if (c !== '\r') field += c;
        }
      }
      if (field !== '' || row.length) { row.push(field); rows.push(row); }
      return rows.filter(r => r.some(v => v !== ''));
    }

    // ---- SWR: stale-while-revalidate cache (cache + dedupe + focus revalidate + mutate) ----
    const _swr = { data: new Map(), subs: new Map(), inflight: new Map(), loud: new Set(), fetchers: new Map(), globalSubs: new Set() };
    const swrNotify = (key) => { const s = _swr.subs.get(key); if (s) s.forEach((cb) => cb()); _swr.globalSubs.forEach((cb) => cb()); };

    // silent = background poll/wake: swaps the cache in without the top bar, and never surfaces its own errors
    const swrRevalidate = (key, fetcher, dedupeMs = 2000, silent) => {
      if (!key || !fetcher) return Promise.resolve();
      if (_swr.inflight.has(key)) return _swr.inflight.get(key);           // dedupe concurrent
      const cur = _swr.data.get(key);
      if (cur && cur.err == null && cur.ts && (Date.now() - cur.ts) < dedupeMs) return Promise.resolve(cur.data); // fresh enough
      if (!silent) _swr.loud.add(key);                                     // only loud reads drive the loading bar
      const settle = () => { _swr.inflight.delete(key); _swr.loud.delete(key); };
      const p = Promise.resolve().then(fetcher).then(
        (data) => { _swr.data.set(key, { data, err: null, ts: Date.now() }); settle(); swrNotify(key); return data; },
        (err)  => { const e = _swr.data.get(key) || {};
          // a silent poll that fails keeps the last good data and stays quiet; stale ts so the next tick retries
          _swr.data.set(key, silent && e.data !== undefined ? { data: e.data, err: null, ts: e.ts } : { data: e.data, err, ts: Date.now() });
          settle(); swrNotify(key); }
      );
      _swr.inflight.set(key, p);
      swrNotify(key);                                                       // flip isValidating
      return p;
    };

    // mutate(key): revalidate · mutate(key, data, false): set cache (data = value | fn), no refetch
    const swrMutate = (key, data, revalidate = true, fetcher) => {
      if (data !== undefined) {
        const e = _swr.data.get(key) || {};
        _swr.data.set(key, { data: typeof data === 'function' ? data(e.data) : data, err: null, ts: Date.now() });
        swrNotify(key);
      }
      const f = fetcher || _swr.fetchers.get(key);
      if (revalidate && f) return swrRevalidate(key, f, 0);

    };

    function SearchableDropdown({ options, value, onChange, placeholder = 'Select...', label, icon, required = false }) {

        return () => document.removeEventListener('mousedown', handleClickOutside);

    // ---- shared DataTable lifecycle: destroy -> empty -> 150ms -> init + .action-icon delegation ----
    // extraDeps: values buildConfig closes over (perm flags) — rebuild when they change, not only on rows
    function useDataTable(tableId, rows, buildConfig, onAction, extraDeps, onRowDoubleClick) {
      const tableRef = useRef(null);
      const sigRef = useRef({ data: '', deps: null }); // last rendered signature — refresh with identical data = no-op
      const actionRef = useRef(onAction);
      const doubleClickRef = useRef(onRowDoubleClick);
      actionRef.current = onAction; // row clicks always see the latest closure
      doubleClickRef.current = onRowDoubleClick;
      useEffect(() => () => { if (tableRef.current) { try { tableRef.current.destroy(); tableRef.current = null; } catch (e) {} } }, []); // destroy on unmount ONLY
      useEffect(() => {
        if (!rows) return;
        const dataSig = JSON.stringify(rows), depsSig = (extraDeps || []).join('|');
        if (tableRef.current && dataSig === sigRef.current.data && depsSig === sigRef.current.deps) return; // background refresh, same data -> untouched
        const sameCols = !!tableRef.current && depsSig === sigRef.current.deps;
        sigRef.current = { data: dataSig, deps: depsSig };
        if (sameCols) { // data-only change -> in-place swap: keeps page/search/order/scroll, zero flash
          try { tableRef.current.clear(); tableRef.current.rows.add(rows); tableRef.current.draw(false); return; } catch (e) {}
        }
        if (tableRef.current) { try { tableRef.current.destroy(); tableRef.current = null; $('#' + tableId).empty(); } catch (e) {} }
        const t = setTimeout(() => {
          try {
            const table = $('#' + tableId).DataTable(Object.assign({
              data: rows, destroy: true, pageLength: 10,
              lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, 'All']],
              language: DT_VI_LANGUAGE,
              responsive: true,
              dom: 'lfrtip', // no B — export buttons live in the page header, fired via API
              columnDefs: [{ targets: '_all', defaultContent: '' }], // json-row schema drift: missing keys render blank, never warn (tn/4)
              buttons: [
                { extend: 'csv',   text: 'CSV',   exportOptions: { columns: ':not(:last-child)' } },
                { extend: 'pdf',   text: 'PDF',   exportOptions: { columns: ':not(:last-child)' } },
                { extend: 'print', text: 'Print', exportOptions: { columns: ':not(:last-child)' } }
              ]
            }, buildConfig()));
            $('#' + tableId).off('click', '.action-icon, .table-record-link');
            $('#' + tableId).on('click', '.action-icon, .table-record-link', function () {
              const rowData = table.row($(this).parents('tr')).data();
              if (rowData) actionRef.current($(this).data('action'), rowData);
            });
            $('#' + tableId).off('dblclick', 'tbody tr');
            if (doubleClickRef.current) $('#' + tableId).on('dblclick', 'tbody tr', function (event) {
              if ($(event.target).closest('button, a, input, select, textarea, label, .action-icon, .table-record-link').length) return;
              const rowData = table.row(this).data();
              if (rowData && doubleClickRef.current) doubleClickRef.current(rowData);
            });
            tableRef.current = table;
          } catch (e) { console.error('DataTable init error:', e); }
        }, 150);
        return () => clearTimeout(t);
      }, [rows].concat(extraDeps || []));
      return tableRef;
    }

        <div className="data-section" style={{textAlign:'center', padding:'50px 20px'}}>
          <i className="fas fa-lock" style={{fontSize:'42px', color:'#ea4335', marginBottom:'14px'}}></i>
          <h2 style={{color:'var(--navy-primary)', marginBottom:'8px'}}>Access Denied</h2>
          <p style={{color:'#666'}}>You don't have permission to view this page.</p>
        </div>
      );
    }

    // ============== Skeleton Components ==============
    function TableSkeleton({ rows = 5, columns = 6 }) {
      return (
        <div className="skeleton-table">
          <div className="skeleton-table-row">
            {[...Array(columns)].map((_, i) => (
              <div key={i} className="skeleton skeleton-table-cell" style={{flex: 1}}></div>
            ))}
          </div>
          {[...Array(rows)].map((_, r) => (
            <div key={r} className="skeleton-table-row">
              {[...Array(columns)].map((_, c) => (
                <div key={c} className="skeleton skeleton-table-cell" style={{flex: 1}}></div>
              ))}
            </div>
          ))}
        </div>
      );
    }

    function useAgencyBranding() {
      const { data: portalResponse, error } = useSWR('portal', () => gsRun('getPublicPortal'), SWR_LIVE);
      const branding = portalResponse && portalResponse.success && portalResponse.branding
        ? portalResponse.branding
        : {};
      return { branding, loading: !portalResponse && !error };
    }

    function ZaloIcon({ size = 18, style }) {
      return (
        <svg className="zalo-logo-img" viewBox="0 0 100 100" style={{ width: size, height: size, display: 'inline-block', verticalAlign: 'middle', ...style }}>
          <circle cx="50" cy="50" r="47" fill="#ffffff" stroke="#008fe5" strokeWidth="4.5" />
          <path d="M 50 15 C 69.33 15 85 30.67 85 50 C 85 69.33 69.33 85 50 85 C 44.2 85 38.7 83.6 33.8 81.1 L 18 86.5 L 22.8 72.3 C 17.9 66.2 15 58.4 15 50 C 15 30.67 30.67 15 50 15 Z" fill="#008fe5" />
          <text x="50.5" y="58" fill="#ffffff" fontFamily="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" fontSize="28" fontWeight="900" textAnchor="middle" letterSpacing="-1.2">Zalo</text>
        </svg>
      );
    }

    function BrandLogo({ logo, className = '', alt = 'Logo công ty' }) {
      const [failed, setFailed] = useState(false);
      useEffect(() => setFailed(false), [logo]);
      if (logo && !failed) {
        return <img src={logo} alt={alt} className={className} onError={() => setFailed(true)} />;
      }
      return <div className={`${className} brand-logo-placeholder`} role="img" aria-label={alt}><i className="fas fa-building"></i></div>;
    }

    // ============== Login Page (staff only — public visitors stay on the portal) ==============
    function LoginPage({ onLogin, onBack }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      const { branding, loading: brandingLoading } = useAgencyBranding();
      const agencyName = branding.name || (brandingLoading ? 'Đang tải…' : 'Hệ thống CRM');

      const handleSubmit = (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        google.script.run
          .withSuccessHandler((result) => {
            setLoading(false);
            if (result.success) {
              onLogin(result.username, result.role, result.email, result.profileImage, result.themeMode, result.customColors, result.permissions, result.canEditRbac, result.authSession);
            } else {
              setError(result.message);
            }
          })
          .withFailureHandler((err) => {
            setLoading(false);
            setError('Không thể kết nối hệ thống: ' + err.message);
          })
          .authenticateUser(username, password);
      };

      return (
        <div className="login-container">
          <div className="login-shell">
            <section className="login-showcase" aria-label="Giới thiệu hệ thống">
              <div className="login-brand">
                <BrandLogo logo={branding.logo} className="login-brand-logo" />
                <div>
                  <div className="login-brand-name">{agencyName}</div>
                  <div className="login-brand-note">{branding.slogan || 'Nền tảng quản trị bất động sản'}</div>
                </div>
              </div>

              <div className="login-showcase-copy">
                <div className="login-eyebrow"><i className="fas fa-sparkles"></i> Vận hành thông minh</div>
                <h1>Một hệ thống.<br/>Toàn bộ hoạt động kinh doanh.</h1>
                <p>Quản lý nguồn hàng, khách hàng, lịch chăm sóc và tài chính trên một nền tảng bảo mật, tập trung.</p>
              </div>

              <div className="login-benefits">
                <div className="login-benefit">
                  <div className="login-benefit-icon"><i className="fas fa-chart-line"></i></div>
                  <div><strong>Số liệu theo thời gian thực</strong><span>Theo dõi hiệu suất và dòng tiền chính xác.</span></div>
                </div>
                <div className="login-benefit">
                  <div className="login-benefit-icon"><i className="fas fa-shield-halved"></i></div>
                  <div><strong>Phân quyền bảo mật</strong><span>Mỗi vai trò chỉ truy cập đúng phạm vi công việc.</span></div>
                </div>
                <div className="login-benefit">
                  <div className="login-benefit-icon"><i className="fas fa-database"></i></div>
                  <div><strong>Dữ liệu tập trung</strong><span>Đồng bộ an toàn trên nền tảng Supabase.</span></div>
                </div>
              </div>
            </section>

            <section className="login-box">
              <div className="login-access-badge">Truy cập nội bộ</div>
              <h2>Chào mừng trở lại</h2>
              <p className="login-subtitle">Đăng nhập bằng tài khoản được cấp để tiếp tục vào hệ thống CRM.</p>
              <form onSubmit={handleSubmit}>
                <div className="login-field">
                  <label htmlFor="staff-username">Tên đăng nhập</label>
                  <div className="login-input-wrap">
                    <i className="fas fa-user"></i>
                    <input id="staff-username" type="text" value={username}
                      onChange={(e) => { setUsername(e.target.value); if (error) setError(''); }}
                      required autoComplete="username" placeholder="Nhập tên đăng nhập" autoFocus />
                  </div>
                </div>
                <div className="login-field">
                  <label htmlFor="staff-password">Mật khẩu</label>
                  <div className="login-input-wrap">
                    <i className="fas fa-lock"></i>
                    <input id="staff-password" type={showPassword ? 'text' : 'password'} value={password}
                      onChange={(e) => { setPassword(e.target.value); if (error) setError(''); }}
                      required autoComplete="current-password" placeholder="Nhập mật khẩu" />
                    <button type="button" className="login-password-toggle" onClick={() => setShowPassword((value) => !value)}
                      aria-label={showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'} title={showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'}>
                      <i className={'fas ' + (showPassword ? 'fa-eye-slash' : 'fa-eye')}></i>
                    </button>
                  </div>
                </div>
                {error && <div className="login-error" role="alert"><i className="fas fa-circle-exclamation"></i><span>{error}</span></div>}
                <button type="submit" className="login-submit" disabled={loading}>
                  {loading ? <><i className="fas fa-spinner fa-spin"></i> Đang đăng nhập…</> : <><i className="fas fa-arrow-right-to-bracket"></i> Đăng nhập an toàn</>}
                </button>
              </form>
              {onBack && <button type="button" className="login-back" onClick={onBack}><i className="fas fa-arrow-left"></i> Quay lại cổng bất động sản</button>}
              <div className="login-security"><i className="fas fa-lock"></i> Kết nối được mã hóa và kiểm soát truy cập</div>
            </section>
          </div>
        </div>
      );
    }

    // ============== Sidebar Component ==============
    function Sidebar({ activeMenu, setActiveMenu, role, user, profileImage, themeMode, onThemeToggle, onLogout, collapsed, setCollapsed, showMobile, setShowMobile, perms, canEditRbac }) {
      const { branding } = useAgencyBranding();
      const menuVisible = (k) => {
        if (ALWAYS_PAGES.indexOf(k) !== -1) return true;
        if (k === 'permissions') return !!canEditRbac;
        if (role === 'Admin') return true; // Admin ALWAYS sees every option — immune to a stale cached session
        return can(perms, k, 'v');
      };
      const go = (k) => { setActiveMenu(k); setShowMobile(false); };

      return (
        <>
          <div className={`sidebar ${collapsed ? 'collapsed' : ''} ${showMobile ? 'show-mobile' : ''}`}>
            <button className="sidebar-close-btn" onClick={() => setShowMobile(false)}>
              <i className="fas fa-times"></i>
            </button>

            <div className="sidebar-header">
              <div className="sidebar-title">
                <i className="fas fa-city"></i>
                <span>{branding.name || 'Hệ thống CRM'}</span>
              </div>
              <button className="collapse-btn" onClick={() => setCollapsed(!collapsed)}>
                <i className={`fas fa-${collapsed ? 'angle-right' : 'angle-left'}`}></i>
              </button>
            </div>

            <div className="sidebar-user-info">
              <div className="sidebar-profile-image">
                <BrandLogo logo={branding.logo || profileImage} alt="Ảnh đại diện" />
              </div>
              <div className="sidebar-user-name">{user}</div>
              <div className="sidebar-user-role">{role}</div>
            </div>

            <div className="sidebar-menu-section">
              {PAGE_GROUPS.map(grp => {
                const items = Object.keys(PAGE_META).filter(k => PAGE_META[k].group === grp && menuVisible(k));
                if (!items.length) return null;
                return (
                  <div className="sidebar-menu-group" key={grp}>
                    <div className="sidebar-menu-title">{grp}</div>
                    <ul className="sidebar-menu">
                      {items.map(k => (
                        <li key={k}>
                          <button className={activeMenu === k ? 'active' : ''} onClick={() => go(k)}>
                            <i className={`fas ${PAGE_META[k].icon}`}></i>
                            <span>{PAGE_META[k].label}</span>
                          </button>
                        </li>
                      ))}
                    </ul>
                  </div>
                );
              })}
            </div>

            <div className="sidebar-theme-toggle">
              <button onClick={onThemeToggle} title={`Switch to ${themeMode === 'light' ? 'Dark' : 'Light'} Mode`}>
                <i className={`fas fa-${themeMode === 'light' ? 'moon' : 'sun'}`}></i>
                <span>{themeMode === 'light' ? 'Dark' : 'Light'} Mode</span>
              </button>
            </div>

            <div className="sidebar-logout">
              <button onClick={onLogout}>
                <i className="fas fa-sign-out-alt"></i>
                <span>Logout</span>
              </button>
            </div>
          </div>
        </>
      );
    }

    // ============== Bottom Navigation (Mobile) ==============
    function BottomNavigation({ activeMenu, setActiveMenu, perms, setShowMobileSidebar }) {
      // up to 3 permitted quick pages + menu
      const quick = [];
      if (can(perms, 'dashboard', 'v')) quick.push('dashboard');
      if (can(perms, 'settings', 'v')) quick.push('settings');
      quick.push('account');

      const labelOf = (k) => k === 'account' ? 'Account' : PAGE_META[k].label.split(' ')[0];
      const navItems = [{ id: 'menu', icon: 'fa-bars', label: 'Menu', onClick: () => setShowMobileSidebar(true) }]
        .concat(quick.slice(0, 3).map(k => ({ id: k, icon: PAGE_META[k].icon, label: labelOf(k), onClick: () => setActiveMenu(k) })));

      return (
        <div className="bottom-nav">
          <div className="bottom-nav-container">
            {navItems.map(item => (
              <button
                key={item.id}
                className={`bottom-nav-item ${item.id !== 'menu' && activeMenu === item.id ? 'active' : ''}`}
                onClick={item.onClick}
              >
                <i className={`fas ${item.icon}`}></i>
                <span>{item.label}</span>
              </button>
            ))}
          </div>
        </div>
      );
    }

    // ============== AdminLTE dashboard components ==============
    // small-box KPI (big num + faded icon + optional "More info" footer)
    function SmallBox({ value, label, icon, color, onMore }) {
      return (
        <div className={'small-box ' + (color || 'bg-navy')}>
          <div className="inner"><h3>{value}</h3><p>{label}</p></div>
          <div className="icon"><i className={'fas ' + icon}></i></div>
          {onMore && <button className="small-box-footer" onClick={onMore}>More info <i className="fas fa-arrow-circle-right"></i></button>}
        </div>
      );
    }

    // % vs previous period — null baseline means no chip (never fake a trend)
    const delta = (cur, prev) => (!prev ? null : ((cur - prev) / prev) * 100);
    const TrendChip = ({ pct }) => {
      if (pct == null || !isFinite(pct)) return null;
      const flat = Math.abs(pct) < 0.05, up = pct > 0;
      return (
        <span className={'trend-chip ' + (flat ? 'trend-flat' : up ? 'trend-up' : 'trend-down')}>
          <i className={'fas fa-' + (flat ? 'minus' : up ? 'arrow-up' : 'arrow-down')}></i>
          {Math.abs(Math.round(pct * 10) / 10)}%
        </span>
      );
    };

    // secondary mini metric — trend/sub/onClick are optional add-ons
    function InfoBox({ value, label, icon, color, trend, sub, onClick }) {
      return (
        <div className={'info-box' + (onClick ? ' clickable' : '')} onClick={onClick}>
          <div className={'info-box-icon ' + (color || 'bg-navy')}><i className={'fas ' + icon}></i></div>
          <div className="info-box-content">
            <div className="info-box-text">{label}</div>
            <div className="info-box-number">{value}<TrendChip pct={trend} /></div>
            {sub && <div className="info-box-sub">{sub}</div>}
          </div>
        </div>
      );
    }

    // collapsible card wrapper for charts/tables/content
    function LteCard({ title, icon, tools, children }) {
      const [open, setOpen] = useState(true);
      return (
        <div className={'lte-card' + (open ? '' : ' collapsed')}>
          <div className="lte-card-header">
            <h3 className="lte-card-title"><i className={'fas ' + icon}></i> {title}</h3>
            <div className="lte-card-tools">
              {tools}
              <button onClick={() => setOpen(!open)} title={open ? 'Collapse' : 'Expand'}><i className={'fas fa-' + (open ? 'minus' : 'plus')}></i></button>
            </div>
          </div>
          <div className="lte-card-body">{children}</div>
        </div>
      );
    }

    // skeleton kpi row while stats load
    function KpiSkeleton({ count }) {
      return (
        <div className="lte-kpi-grid">
          {[...Array(count || 4)].map((_, i) => (
            <div key={i} className="small-box bg-navy" style={{opacity: .55}}>
              <div className="inner">
                <div className="skeleton" style={{height: '30px', width: '55%', marginBottom: '8px'}}></div>
                <div className="skeleton" style={{height: '14px', width: '75%'}}></div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ============== Dashboard widgets (donut / trend / lists / funnel / agents) ==============
    // status doughnut with the total in the hole + share legend
    function StatusDonut({ counts, order, total, caption }) {
      const labels = order.filter((s) => counts[s]);
      if (!labels.length) return <p className="dash-empty"><i className="fas fa-chart-pie"></i>Nothing to chart yet</p>;
      const data = { labels, datasets: [{ data: labels.map((s) => counts[s]), backgroundColor: labels.map((s) => STAGE_COLORS[s] || '#6c757d'), borderWidth: 0 }] };
      return (
        <div className="donut-box">
          <div className="donut-hold">
            <ChartCanvas type="doughnut" data={data} height={186} options={{ cutout: '68%', plugins: { legend: { display: false } } }} />
            <div className="donut-mid"><b>{total}</b><span>{caption}</span></div>
          </div>
          <div className="donut-legend">
            {labels.map((s) => (
              <div className="dl-item" key={s}>
                <span className="dl-dot" style={{ background: STAGE_COLORS[s] || '#6c757d' }}></span>
                <span className="dl-name">{s}</span>
                <span className="dl-num">{counts[s]}</span>
                <span className="dl-pct">({total ? Math.round((counts[s] / total) * 1000) / 10 : 0}%)</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // leads/day area line — client slices the 90-day series the backend already sent
    function LeadsTrend({ series, days }) {
      const cut = (series || []).slice(-days);
      const data = { labels: cut.map((p) => p.d.substr(5).replace('-', '/')),
        datasets: [{ label: 'Leads', data: cut.map((p) => p.n), borderColor: '#0074D9', backgroundColor: 'rgba(0,116,217,.18)',
          fill: true, tension: .38, borderWidth: 2, pointRadius: days > 30 ? 0 : 2, pointHoverRadius: 4 }] };
      return (
        <>
          <ChartCanvas type="line" data={data} height={214}
            options={{ plugins: { legend: { display: false } }, interaction: { mode: 'index', intersect: false },
              scales: { y: { beginAtZero: true, ticks: { precision: 0 } }, x: { ticks: { maxTicksLimit: 8, autoSkip: true } } } }} />
          <div className="fn-foot" style={{ color: '#8b9aa8', fontWeight: 600 }}>
            {cut.reduce((s, p) => s + p.n, 0)} khách hàng mới trong {days} ngày qua
          </div>
        </>
      );
    }

    // thumbnail row used by Recent Properties + Upcoming Viewings
    const DashRow = ({ image, icon, title, sub, right, small, onClick }) => (
      <div className="dlist-row" onClick={onClick}>
        {image ? <img className="dlist-thumb" src={image} alt="" loading="lazy" onError={(e) => { e.target.style.visibility = 'hidden'; }} />
               : <div className="dlist-thumb ph"><i className={'fas ' + (icon || 'fa-image')}></i></div>}
        <div className="dlist-main"><div className="dlist-t">{title}</div><div className="dlist-s">{sub}</div></div>
        <div className="dlist-r"><div className="dlist-p">{right}</div><div className="dlist-d">{small}</div></div>
        <i className="fas fa-chevron-right dlist-chev"></i>
      </div>
    );

    // cumulative pipeline funnel — width relative to the top stage, step-over-step %
    function FunnelChart({ steps, rate, onPick }) {
      const top = (steps && steps[0] && steps[0].count) || 0;
      if (!top) return <p className="dash-empty"><i className="fas fa-filter"></i>No leads in the pipeline yet</p>;
      return (
        <div>
          {steps.map((s, i) => (
            <div className="fn-row" key={s.stage}>
              <span className="fn-label">{s.stage}</span>
              <div className="fn-bar" style={{ width: Math.max(26, Math.round((s.count / top) * 100)) + '%', background: STAGE_COLORS[s.stage] || '#6c757d' }}
                   onClick={onPick} title={'Open Leads'}>{s.count}</div>
              <span className="fn-pct">{i && steps[i - 1].count ? Math.round((s.count / steps[i - 1].count) * 100) + '%' : ''}</span>
            </div>
          ))}
          <div className="fn-foot">Tỷ lệ chuyển đổi: {rate}%</div>
        </div>
      );
    }

    // top 5 by closed value this month
    function TopAgents({ rows }) {
      const top = (rows || []).slice(0, 5), max = top.reduce((m, a) => Math.max(m, a.dealValueM || 0), 0);
      if (!top.length) return <p className="dash-empty"><i className="fas fa-ranking-star"></i>No agent activity yet</p>;
      return (
        <>
          {top.map((a) => (
            <div className="ag-row" key={a.agent}>
              <div className="ag-av">{String(a.agent || '?').substr(0, 2)}</div>
              <div className="ag-main">
                <div className="ag-n">{a.agent}</div>
                <div className="ag-s">{a.won} thành công · {a.listings} tin đăng · {a.openLeads} đang xử lý</div>
                <div className="ag-bar"><span style={{ width: (max ? Math.round((a.dealValueM || 0) / max * 100) : 0) + '%' }}></span></div>
              </div>
              <div className="ag-v">{pkrShort(a.dealValueM || 0)}<div className="ag-s" style={{ fontWeight: 400 }}>Closed</div></div>
            </div>
          ))}
        </>
      );
    }

    // ============== Dashboard View (role-scoped: agency-wide vs own-book) ==============
    function DashboardView({ currentUser, setActiveMenu }) {
      const { data, error, isLoading, mutate } = useSWR('dash:stats', () => gsRun('getDashboardStats', currentUser), SWR_LIVE);
      const [leadDays, setLeadDays] = useState(30); // leads-trend range chips — hook stays above the early returns
      const [kpiTab, setKpiTab] = useState('finance'); // Hook kpiTab đặt ở đầu component để tuân thủ Rules of Hooks
      const stats = data && data.success ? data.data : null;
      const go = (p) => setActiveMenu && setActiveMenu(p);

      if (isLoading) return <KpiSkeleton />;
      if (!stats) return ( // failed load — say so, don't skeleton forever
        <div className="data-section" style={{ textAlign: 'center', padding: '40px 20px' }}>
          <i className="fas fa-triangle-exclamation" style={{ fontSize: 36, color: '#e6a700', marginBottom: 10 }}></i>
          <h3 style={{ color: 'var(--navy-primary)', marginBottom: 6 }}>Dashboard failed to load</h3>
          <p style={{ color: '#789', marginBottom: 14 }}>{(data && data.message) || (error && String(error.message || error)) || 'Server error'}</p>
          <button className="btn btn-primary" onClick={() => mutate()}><i className="fas fa-rotate-right"></i> Retry</button>
        </div>
      );

      const agency = stats.scope === 'agency';
      const inv = stats.inventory || {}, prev = stats.prev || {};
      const invTotal = Object.keys(inv).reduce((s, k) => s + (inv[k] || 0), 0);
      const targetPct = stats.myTarget ? Math.round((stats.dealsMonthValue || 0) / stats.myTarget * 100) : 0;
      // [value, label, icon, color, page]
      const KPI = [
        [stats.activeListings || 0, agency ? 'Bất động sản đang mở' : 'BĐS tôi phụ trách', 'fa-building', 'bg-navy', 'properties'],
        [stats.openLeads || 0, agency ? 'Khách hàng đang xử lý' : 'Khách hàng của tôi', 'fa-user-tag', 'bg-info', 'leads'],
        [stats.overdueFollowUps || 0, 'Lịch chăm sóc quá hạn', 'fa-bell', 'bg-danger', 'followups'],
        [stats.todayAppointments || 0, 'Lịch xem nhà hôm nay', 'fa-calendar-check', 'bg-success', 'appointments']
      ];
      const viewAll = (p) => <button className="card-link" onClick={() => go(p)}>Xem tất cả <i className="fas fa-arrow-right" style={{ fontSize: 10 }}></i></button>;

      return (
        <>
          {/* GIAO DIỆN DESKTOP: Giữ nguyên 100% 4 hàng lưới AdminLTE */}
          <div className="dash-desktop-kpis">
            <div className="lte-kpi-grid">
              {KPI.map(([v, l, ic, c, page], i) => <SmallBox key={i} value={v} label={l} icon={ic} color={c} onMore={() => go(page)} />)}
            </div>
            <div className="lte-kpi-grid">
