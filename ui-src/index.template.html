  <script>
    (function () {
      var root = document.documentElement;
      var put = function (v) {
        if (!v) return;
        try { if (typeof v === 'string') v = JSON.parse(v); } catch (e) { return; }
        if (v && v.vars) v = v.vars; // support {themeId,vars} shape
        Object.keys(v || {}).forEach(function (k) { if (k.indexOf('--') === 0) root.style.setProperty(k, v[k]); });
      };
      try { put(window.__APP_THEME_RAW__); } catch (e) {}          // global default (admin-set)
      try { put(localStorage.getItem('app_theme_vars')); } catch (e) {} // per-device override wins
    })();
  </script>

        'Add Amenity':'Thêm tiện ích','In Use':'Đang sử dụng','Unused':'Chưa sử dụng','Most Tagged':'Được gắn nhiều nhất','Tagged Listings':'Tin đăng đã gắn',
        'Add User':'Thêm người dùng','Total Users':'Tổng người dùng','Active Users':'Người dùng hoạt động','Admin Users':'Quản trị viên',
        'Profile Picture':'Ảnh đại diện','Currently Applied':'Đang áp dụng','Set as Default':'Đặt làm mặc định','Advanced custom colors':'Tùy chỉnh màu nâng cao',
        'Add':'Thêm','Change Password':'Đổi mật khẩu','Real Estate CRM & Property Portal':'CRM và cổng thông tin bất động sản',
        'Module':'Phân hệ','Demo Login':'Tài khoản đăng nhập thử','Admin':'Quản trị viên','Manager':'Quản lý','Agent':'Nhân viên',
        'Rent Out':'Cho thuê','Sell':'Bán','Walk-in':'Khách trực tiếp','Referral':'Giới thiệu','Phone Call':'Cuộc gọi','Other':'Khác',
        'Appointment Added':'Đã thêm lịch hẹn','Appointment Updated':'Đã cập nhật lịch hẹn','Appointment Completed':'Đã hoàn tất lịch hẹn',
        'System Setup':'Thiết lập hệ thống','Enquiry Received':'Đã nhận yêu cầu tư vấn','Offer Added':'Đã thêm chào giá',
        'Property Added':'Đã thêm bất động sản','Property Updated':'Đã cập nhật bất động sản','Lead Added':'Đã thêm khách hàng',
        'Lead Updated':'Đã cập nhật khách hàng','Deal Added':'Đã thêm giao dịch','Deal Updated':'Đã cập nhật giao dịch',
        'Follow-Up Added':'Đã thêm lịch chăm sóc','Follow-Up Updated':'Đã cập nhật lịch chăm sóc','User Login':'Người dùng đăng nhập'
      }).forEach(([key, value]) => exact.set(key, value));

      const phrases = [
        [/^(\d+) listings$/, '$1 tin đăng'], [/^(\d+) listing$/, '$1 tin đăng'],
        [/^For Sale$/, 'Đang bán'], [/^For Rent$/, 'Cho thuê'], [/^\/monthly$/, '/tháng'], [/^\/yearly$/, '/năm'],
        [/^(\d+) active tenancies$/, '$1 hợp đồng thuê đang hoạt động'],
        [/^(\d+) open$/, '$1 đang xử lý'], [/^(\d+) won$/, '$1 thành công'],
        [/^Loading\.\.\.$/, 'Đang tải…'], [/^Search\.\.\.$/, 'Tìm kiếm…'],
        [/^Delete (.+)\?$/, 'Xóa $1?'], [/^Edit (.+)$/, 'Chỉnh sửa $1'], [/^Add (.+)$/, 'Thêm $1'],
        [/^Properties \((\d+)\)$/, 'Bất động sản ($1)'], [/^Deals \((\d+)\)$/, 'Giao dịch ($1)'],
        [/^Welcome, (.+)$/, 'Xin chào, $1'], [/^Showing (\d+) to (\d+) of (\d+) entries$/, 'Hiển thị $1 đến $2 trong $3 dòng'],
        [/^Showing 0 to 0 of 0 entries$/, 'Không có dữ liệu'], [/^filtered from (\d+) total entries$/, 'lọc từ tổng cộng $1 dòng'],
        [/^(.+): activate to sort column ascending$/, '$1: nhấn để sắp xếp tăng dần'],
        [/^(.+): activate to sort column descending$/, '$1: nhấn để sắp xếp giảm dần'],
        [/^Properties: (\d+)$/, 'Bất động sản: $1'], [/^Leads: (\d+)$/, 'Khách hàng: $1'],
        [/^(\d+) won · (\d+) listings · (\d+) open$/, '$1 thành công · $2 tin đăng · $3 đang xử lý'],
        [/^Delete appointment #(\d+)$/, 'Xóa lịch hẹn #$1'], [/^Delete deal #(\d+)$/, 'Xóa giao dịch #$1'],
        [/^Delete follow-up #(\d+)$/, 'Xóa lịch chăm sóc #$1'], [/^Closed \(mo\)$/, 'Đã chốt (tháng)'],
        [/^Hello, (.+)$/, 'Xin chào, $1'], [/^(\d+) eligible$/, '$1 hồ sơ phù hợp'],
        [/^Open the (\d+) eligible records$/, 'Mở $1 hồ sơ phù hợp'],
        [/^Rent \/ mo$/, 'Tiền thuê / tháng'], [/^due (\d+)(?:st|nd|rd|th)$/, 'đến hạn ngày $1'],
        [/^(\d+) minutes$/, '$1 phút'], [/^(\d+) hours$/, '$1 giờ'],
        [/^No (.+) found$/, 'Không tìm thấy $1'], [/^No (.+) yet\.?$/, 'Chưa có $1.'],
        [/^Search (.+)…$/, 'Tìm $1…'], [/^Select (.+)…$/, 'Chọn $1…']
      ];

      function translate(value) {
        if (!value) return value;
        const leading = value.match(/^\s*/)[0];
        const trailing = value.match(/\s*$/)[0];
        const core = value.trim();
        if (!core) return value;
        if (exact.has(core)) return leading + exact.get(core) + trailing;
        for (const [pattern, replacement] of phrases) {
          if (pattern.test(core)) return leading + core.replace(pattern, replacement) + trailing;
        }
        return value;
      }

      function localize(root) {
        if (!root) return;
        if (root.nodeType === Node.TEXT_NODE) {
          const parent = root.parentElement;
          if (!parent || /^(SCRIPT|STYLE|TEXTAREA)$/.test(parent.tagName)) return;
          const next = translate(root.nodeValue);
          if (next !== root.nodeValue) root.nodeValue = next;
          return;
        }
        if (root.nodeType !== Node.ELEMENT_NODE && root.nodeType !== Node.DOCUMENT_FRAGMENT_NODE) return;
        if (root.nodeType === Node.ELEMENT_NODE) {
          ['placeholder','title','aria-label'].forEach((attr) => {
            if (root.hasAttribute(attr)) {
              const current = root.getAttribute(attr);
              const next = translate(current);
              if (next !== current) root.setAttribute(attr, next);
            }
          });
        }
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        let node;
        while ((node = walker.nextNode())) localize(node);
        if (root.querySelectorAll) root.querySelectorAll('[placeholder],[title],[aria-label]').forEach((el) => localize(el));
      }

      let queued = false;
      const pending = new Set();
      const flush = () => {
        queued = false;
        pending.forEach(localize);
        pending.clear();
      };
      new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          mutation.addedNodes.forEach((node) => pending.add(node));
          if (mutation.type === 'characterData') pending.add(mutation.target);
        });
        if (!queued) { queued = true; requestAnimationFrame(flush); }
      }).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
      localize(document.body);
      document.documentElement.lang = 'vi';
      document.title = 'CRM Bất Động Sản & Cổng Thông Tin';
    })();
  </script>
